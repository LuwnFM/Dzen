name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Compile collector
        run: |
          python -m py_compile collector/dzen_collect.py
          python -m py_compile site/downloads/dzen_collect_template.py

      - name: Python tests
        run: python -m pytest -q

      - name: Validate browser JavaScript
        run: node --check site/assets/app.js
